name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: courier_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d courier_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/courier_platform?schema=public
      REDIS_URL: redis://localhost:6379
      URBANEBOLT_BASE_URL: https://uat.urbanebolt.in
      URBANEBOLT_USERNAME: ci-placeholder
      URBANEBOLT_PASSWORD: ci-placeholder
      URBANEBOLT_CUSTOMER_CODE: ci-placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm prisma:deploy

      - name: Run static checks and unit tests
        run: pnpm check

      - name: Run integration tests
        run: pnpm test:integration

      - name: Build runtime container
        run: docker build --tag easecommerce-courier-platform:ci .
